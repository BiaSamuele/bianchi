<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Orientamento ISIS Romagnosi - Verso un Futuro Sostenibile</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,700;0,900;1,700&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Inter', sans-serif;
        touch-action: manipulation;
        overflow: hidden; 
        background-color: #f0fdf4; /* emerald-50 */
      }

      h1, h2, h3, h4, h5, h6, .font-lexend {
        font-family: 'Lexend', sans-serif;
      }

      /* Eco-Friendly Background Pattern */
      .bg-eco-pattern {
        background-color: #f0fdf4;
        background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%2316a34a' fill-opacity='0.05'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2v-4h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2v-4h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
      }

      /* Floating Leaves Animation */
      .eco-container {
        position: absolute;
        inset: 0;
        pointer-events: none;
        z-index: 5;
        overflow: hidden;
      }

      .leaf {
        position: absolute;
        top: -10%;
        width: 30px;
        height: 30px;
        fill: #4ade80;
        opacity: 0.3;
        animation: leaf-fall linear infinite;
      }

      @keyframes leaf-fall {
        0% { transform: translateY(0) rotate(0deg) translateX(0); }
        25% { transform: translateY(25vh) rotate(90deg) translateX(50px); }
        50% { transform: translateY(50vh) rotate(180deg) translateX(0); }
        75% { transform: translateY(75vh) rotate(270deg) translateX(-50px); }
        100% { transform: translateY(110vh) rotate(360deg) translateX(0); }
      }

      .leaf-1 { left: 10%; animation-duration: 15s; animation-delay: 0s; }
      .leaf-2 { left: 30%; animation-duration: 12s; animation-delay: 2s; }
      .leaf-3 { left: 50%; animation-duration: 18s; animation-delay: 4s; }
      .leaf-4 { left: 70%; animation-duration: 14s; animation-delay: 1s; }
      .leaf-5 { left: 90%; animation-duration: 16s; animation-delay: 3s; }

      .glass-card {
        background: rgba(255, 255, 255, 0.85); 
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid rgba(255, 255, 255, 0.5);
        box-shadow: 0 10px 30px rgba(22, 101, 52, 0.1);
      }

      .custom-scrollbar::-webkit-scrollbar { width: 6px; }
      .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(22, 101, 52, 0.2); border-radius: 10px; }

      .animate-fade-in { animation: fadeIn 0.8s ease-out forwards; }
      @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
      
      .typing-dot {
        width: 6px; height: 6px; border-radius: 50%; display: inline-block;
        animation: typingBounce 1.4s infinite ease-in-out both; background-color: #16a34a;
      }
      @keyframes typingBounce { 0%, 80%, 100% { transform: translateY(0); opacity: 0.5; } 40% { transform: translateY(-6px); opacity: 1; } }

      .eco-gradient-text {
        background: linear-gradient(135deg, #166534 0%, #22c55e 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "lucide-react": "https://aistudiocdn.com/lucide-react@^0.554.0",
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.30.0"
  }
}
</script>
</head>
  <body class="bg-eco-pattern text-slate-800 antialiased overflow-hidden selection:bg-emerald-100 selection:text-emerald-900">
    <div id="root" class="h-[100dvh] w-screen overflow-hidden"></div>
  </body>
</html>
